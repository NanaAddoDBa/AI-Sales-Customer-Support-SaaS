name: Format D1-D3 once
on:
  push:
    branches: [feat/d1-d3-foundations]
    paths: [.github/workflows/format-d1-d3-once.yml]
permissions:
  contents: read
concurrency:
  group: format-d1-d3-once
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'NanaAddoDBa/AI-Sales-Customer-Support-SaaS' && github.ref == 'refs/heads/feat/d1-d3-foundations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm format:check
      - name: Publish formatting only without force
        shell: bash
        run: |
          git add --update -- apps packages scripts tests .github
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'style: apply pinned formatter to D1-D3 foundations'
          git push origin HEAD:refs/heads/feat/d1-d3-foundations
